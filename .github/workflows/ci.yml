name: Verify simulator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, build and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run lint
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulation-coverage-${{ matrix.os }}
          path: coverage/
          retention-days: 14

  browser:
    name: Production browser smoke tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install headless Chromium
        run: npx playwright install chromium --only-shell
        timeout-minutes: 5
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Publish verified GitHub Pages build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
